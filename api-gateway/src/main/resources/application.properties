# ==========================
# Swagger Aggregation
# ==========================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Flight Service Swagger
springdoc.swagger-ui.urls[0].name=flight-service
springdoc.swagger-ui.urls[0].url=/flight-service/v3/api-docs

# User Service Swagger
springdoc.swagger-ui.urls[1].name=user-service
springdoc.swagger-ui.urls[1].url=/user-service/v3/api-docs

# Payment Service Swagger
springdoc.swagger-ui.urls[2].name=payment-service
springdoc.swagger-ui.urls[2].url=/payment-service/v3/api-docs

# Booking Service Swagger
springdoc.swagger-ui.urls[3].name=booking-service
springdoc.swagger-ui.urls[3].url=/booking-service/v3/api-docs
